# Conexão com o MongoDB.
# Padrão: MongoDB local. Para usar outro servidor (ex.: o cluster da disciplina), defina a
# variável de ambiente MONGODB_URI. Nenhuma credencial fica gravada no código.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

# A autenticação é feita pelo UsuarioDetailsService (usuários e perfis no MongoDB).
# Não há mais usuário/senha padrão do Spring Security.

# Dados de demonstração (um usuário por perfil + produtos de exemplo).
# Em ambiente real: app.seed.enabled=false
app.seed.enabled=${APP_SEED_ENABLED:true}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=INFO
