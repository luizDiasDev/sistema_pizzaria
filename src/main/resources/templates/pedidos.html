<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:if="${ehGerente or ehAtendente}" th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Entrada</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th class="text-end">Total</th>
                        <th>Status</th>
                        <th>Saída</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-3 small">
                            <span th:text="${@formatadorData.formatar(pedido.dataEntrada)}"></span><br>
                            <span class="text-muted">por <span th:text="${pedido.criadoPor ?: '—'}"></span></span>
                        </td>
                        <td>
                            <span th:text="${pedido.clienteNome ?: pedido.clienteId}"></span><br>
                            <span class="badge bg-light text-dark border" th:text="${pedido.tipoEfetivo()}"></span>
                        </td>
                        <td class="small">
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade + 'x ' + item.nomeProduto}"></div>
                            <span th:if="${#lists.isEmpty(pedido.itens)}" class="text-muted"
                                  th:text="${(pedido.quantidade ?: '') + ' ' + (pedido.tipoPizza ?: '') + ' ' + (pedido.sabor ?: '')}"></span>
                        </td>
                        <td class="text-end">
                            <span class="text-decoration-line-through text-muted small"
                                  th:if="${pedido.valorDesconto != null and pedido.valorDesconto.signum() > 0}"
                                  th:text="${'R$ ' + #numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA')}"></span>
                            <div class="fw-bold"
                                 th:text="${'R$ ' + #numbers.formatDecimal(pedido.total ?: 0, 1, 'POINT', 2, 'COMMA')}"></div>
                            <span class="badge bg-info text-dark"
                                  th:if="${pedido.valorDesconto != null and pedido.valorDesconto.signum() > 0}"
                                  th:text="${'-' + pedido.descontoPercentual + '%'}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:with="st=${pedido.statusAtual().name()}"
                                  th:classappend="${st == 'FINALIZADO'} ? 'bg-success' :
                                                  (${st == 'CANCELADO'} ? 'bg-danger' :
                                                  (${st == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${st == 'SAIU_PARA_ENTREGA' or st == 'RETIRADO'} ? 'bg-primary' : 'bg-secondary')))"
                                  th:text="${pedido.statusAtual().rotulo}">
                            </span>
                            <div class="small text-muted mt-1" th:if="${pedido.statusAtual().name() == 'CANCELADO'}">
                                <span th:text="${pedido.justificativaCancelamento}"></span><br>
                                <span th:text="${'por ' + pedido.canceladoPor}"></span>
                            </div>
                        </td>
                        <td class="small">
                            <span th:if="${pedido.dataSaida != null}">
                                <span th:text="${@formatadorData.formatar(pedido.dataSaida)}"></span><br>
                                <span class="text-muted" th:text="${'por ' + pedido.saidaPor}"></span>
                            </span>
                            <span th:if="${pedido.dataSaida == null}" class="text-muted">—</span>
                        </td>
                        <td class="text-end pe-3">
                            <th:block th:if="${ehGerente}">
                                <form th:if="${pedido.proximoStatusEsperado() != null}"
                                      th:action="@{/pedidos/{id}/avancar(id=${pedido.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" th:value="${pedido.proximoStatusEsperado().name()}">
                                    <button type="submit" class="btn btn-sm btn-success mb-1">
                                        <i class="bi bi-arrow-right-circle"></i>
                                        <span th:text="${pedido.proximoStatusEsperado().rotulo}"></span>
                                    </button>
                                </form>
                                <button type="button" class="btn btn-sm btn-outline-info mb-1"
                                        th:if="${pedido.statusAtual().antesDaSaida()}"
                                        th:attr="data-id=${pedido.id}" onclick="abrirDesconto(this)">
                                    <i class="bi bi-percent"></i> Desconto
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger mb-1"
                                        th:if="${pedido.statusAtual().antesDaSaida()}"
                                        th:attr="data-id=${pedido.id}" onclick="abrirCancelamento(this)">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <div class="modal fade" id="modalDesconto" tabindex="-1" th:if="${ehGerente}">
        <div class="modal-dialog">
            <form method="post" id="formDesconto" class="modal-content">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-header">
                    <h5 class="modal-title">Aplicar desconto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label for="percentual" class="form-label">Percentual (máximo 20%)</label>
                    <input type="number" step="0.01" min="0.01" max="20" class="form-control"
                           id="percentual" name="percentual" required>
                    <div class="form-text">Só é possível antes da saída para entrega/retirada.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-primary">Aplicar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="modalCancelamento" tabindex="-1" th:if="${ehGerente}">
        <div class="modal-dialog">
            <form method="post" id="formCancelamento" class="modal-content">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-header">
                    <h5 class="modal-title">Cancelar pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label for="justificativa" class="form-label">Justificativa (obrigatória)</label>
                    <textarea class="form-control" id="justificativa" name="justificativa" rows="3"
                              minlength="5" required></textarea>
                    <div class="form-text">O pedido é preservado no histórico e não poderá mais ser alterado.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-danger">Cancelar pedido</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function abrirDesconto(botao) {
            document.getElementById('formDesconto').action = '/pedidos/' + encodeURIComponent(botao.dataset.id) + '/desconto';
            new bootstrap.Modal(document.getElementById('modalDesconto')).show();
        }
        function abrirCancelamento(botao) {
            document.getElementById('formCancelamento').action = '/pedidos/' + encodeURIComponent(botao.dataset.id) + '/cancelar';
            new bootstrap.Modal(document.getElementById('modalCancelamento')).show();
        }
    </script>

</div>

</body>
</html>
